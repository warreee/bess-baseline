[project]
name = "bess-baseline"
version = "0.1.0"
description = "An open day-ahead baseline for battery storage behind the meter: what an owner earns with plain price arbitrage, to judge BSP offers against."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ward Schodts", email = "ward@energybytes.be" }]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12"]

[project.scripts]
bess-baseline = "bess_baseline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
